[package]
name = "viscosity-cli"
description = "The `viscosity` command: compile and explain JavaScript and Python data layouts."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["compilers", "command-line-utilities", "development-tools"]
rust-version.workspace = true
# The tests (and the benchmark example) read programs and fixtures from the
# rest of the repository, so they are left out of the package.
exclude = ["tests/", "examples/"]

[[bin]]
name = "viscosity"
path = "src/main.rs"

[dependencies]
viscosity-core.workspace = true
viscosity-frontend-js.workspace = true
viscosity-frontend-python.workspace = true
serde_json = "1"
