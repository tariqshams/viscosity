[package]
name = "viscosity-core"
description = "Viscosity core: SSA construction, CFG utilities, the layout analyses, the planner and explain."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/viscosity-core"
readme.workspace = true
keywords.workspace = true
categories = ["compilers"]
rust-version.workspace = true
# The tests (and the benchmark example) read programs and fixtures from the
# rest of the repository, so they are left out of the package.
exclude = ["tests/"]

[dependencies]
viscosity-vir.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
# Path only, no version: cargo drops such a dev-dependency when packaging,
# which breaks the cycle (frontend-js depends on core). The tests that use
# it run in the workspace, not from the packaged crate.
viscosity-frontend-js = { path = "../frontend-js" }
