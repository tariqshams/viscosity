[workspace]
resolver = "2"
members = ["crates/vir", "crates/core", "crates/frontend-js", "crates/frontend-python", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.0.2"
edition = "2021"
authors = ["Tariq Shams"]
license = "MIT"
repository = "https://github.com/tariqshams/viscosity"
homepage = "https://viscosity.dev"
documentation = "https://viscosity.dev"
readme = "README.md"
keywords = ["compiler", "data-layout", "struct-of-arrays", "javascript", "python"]
rust-version = "1.97"

[workspace.dependencies]
viscosity-vir = { path = "crates/vir", version = "0.0.2" }
viscosity-core = { path = "crates/core", version = "0.0.2" }
viscosity-frontend-js = { path = "crates/frontend-js", version = "0.0.2" }
viscosity-frontend-python = { path = "crates/frontend-python", version = "0.0.2" }
oxc_allocator = "0.156"
oxc_ast = "0.156"
oxc_parser = "0.156"
oxc_span = "0.156"
oxc_syntax = "0.156"
oxc_ast_visit = "0.156"
oxc_semantic = "0.156"
oxc_diagnostics = "0.156"
wasm-bindgen = "=0.2.106"
indexmap = "2"
rustc-hash = "2"

[profile.release]
lto = "thin"
codegen-units = 1
